<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ECEEEB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Plateload</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="app" aria-live="polite"></main>
<div id="rest" hidden></div>
<nav hidden>
  <button data-act="go" data-view="today">Today</button>
  <button data-act="go" data-view="week">Week</button>
  <button data-act="go" data-view="progress">Progress</button>
</nav>
<div id="sheet" hidden></div>
<div id="toast" role="status" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
